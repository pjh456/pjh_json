name: CI

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (GCC)
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            ccache_variant: ccache
          - name: Linux (Clang)
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            ccache_variant: ccache
          - name: macOS
            os: macos-latest
            cc: clang
            cxx: clang++
            ccache_variant: ccache
          - name: Windows (MSVC)
            os: windows-latest
            cc: cl
            cxx: cl
            ccache_variant: ccache

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.name }}
          variant: ${{ matrix.ccache_variant }}

      - name: Setup MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vsPath = vswhere -latest -property installationPath
          cmd /c "`"$vsPath\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object { Add-Content $env:GITHUB_ENV $_ }

      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          CMAKE_C_COMPILER_LAUNCHER: ${{ matrix.ccache_variant }}
          CMAKE_CXX_COMPILER_LAUNCHER: ${{ matrix.ccache_variant }}
        run: cmake -B build -G Ninja -DPJH_JSON_BUILD_TESTS=ON -DPJH_JSON_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  deps-system:
    name: Linux (GCC, system deps, offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install distro packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libbenchmark-dev nlohmann-json3-dev rapidjson-dev

      # The runner's doctest-dev (2.4.11) is below the test suite's floor:
      # doctest < 2.5.0 cannot stringify std::pmr::basic_string. Install the
      # pinned 2.5.0 into a local prefix so find_package() succeeds; the
      # pjh_json configure itself stays fully disconnected.
      - name: Install doctest 2.5.0
        run: |
          git clone --depth 1 --branch v2.5.0 \
            https://github.com/doctest/doctest.git /tmp/doctest-src
          cmake -S /tmp/doctest-src -B /tmp/doctest-build -G Ninja \
            -DCMAKE_INSTALL_PREFIX="$HOME/.local" \
            -DDOCTEST_WITH_TESTS=OFF -DDOCTEST_NO_INSTALL=OFF
          cmake --build /tmp/doctest-build --target install

      - name: Configure (system deps only)
        env:
          CC: gcc
          CXX: g++
        run: >
          cmake -B build -G Ninja
          -DPJH_JSON_DEP_MODE=SYSTEM
          -DPJH_JSON_BUILD_TESTS=ON
          -DPJH_JSON_BUILD_BENCHMARKS=ON
          -DFETCHCONTENT_FULLY_DISCONNECTED=ON
          -DCMAKE_PREFIX_PATH="$HOME/.local"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  format:
    name: Linux (clang-format, changed lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # need the base commit for merge-base/diff
          submodules: false         # formatting is source-only; skip submodules

      - name: Install pinned clang-format
        run: |
          # Pin LLVM 18.1.8: clang-format output is not stable across major
          # versions, so local and CI must agree (see README "Formatting & lint").
          sudo apt-get update
          sudo apt-get install -y clang-format-18   # provides git-clang-format-18
          clang-format-18 --version

      - name: Check changed lines
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
            # New-branch / force-push pushes send the all-zero SHA: fall back.
            if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
              BASE="HEAD~1"
            fi
            # First commit in the repo has no HEAD~1: nothing to compare.
            if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
              echo "No base commit to compare against; skipping."
              exit 0
            fi
          fi
          git-clang-format-18 --diff "$BASE" > /tmp/fmt.patch || true
          if grep -q '^diff ' /tmp/fmt.patch; then
            echo "::error::clang-format found changes in lines touched by this diff."
            echo "Fix locally with:  git-clang-format-18 --force $BASE"
            cat /tmp/fmt.patch
            exit 1
          fi

  sanitize:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (Clang, ASan+UBSan)
            cache_key: Linux-Clang-ASan-UBSan
            cc: clang
            cxx: clang++
            sanitizers: address,undefined
            asan_options: detect_leaks=1:abort_on_error=1:strict_string_checks=1
            ubsan_options: halt_on_error=1:print_stacktrace=1
            tsan_options: ""
          - name: Linux (Clang, TSan)
            cache_key: Linux-Clang-TSan
            cc: clang
            cxx: clang++
            sanitizers: thread
            asan_options: ""
            ubsan_options: ""
            tsan_options: halt_on_error=1:second_deadlock_stack=1

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.cache_key }}
          variant: ccache

      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DPJH_JSON_BUILD_TESTS=ON
          -DPJH_JSON_SANITIZERS=${{ matrix.sanitizers }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          ASAN_OPTIONS: ${{ matrix.asan_options }}
          UBSAN_OPTIONS: ${{ matrix.ubsan_options }}
          TSAN_OPTIONS: ${{ matrix.tsan_options }}
        run: ctest --test-dir build --output-on-failure
