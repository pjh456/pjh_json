name: CI

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (GCC)
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            ccache_variant: ccache
          - name: Linux (Clang)
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            ccache_variant: ccache
          - name: macOS
            os: macos-latest
            cc: clang
            cxx: clang++
            ccache_variant: ccache
          - name: Windows (MSVC)
            os: windows-latest
            cc: cl
            cxx: cl
            ccache_variant: ccache

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.name }}
          variant: ${{ matrix.ccache_variant }}

      - name: Setup MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vsPath = vswhere -latest -property installationPath
          cmd /c "`"$vsPath\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object { Add-Content $env:GITHUB_ENV $_ }

      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          CMAKE_C_COMPILER_LAUNCHER: ${{ matrix.ccache_variant }}
          CMAKE_CXX_COMPILER_LAUNCHER: ${{ matrix.ccache_variant }}
        run: cmake -B build -G Ninja -DPJH_JSON_BUILD_TESTS=ON -DPJH_JSON_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitize:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (Clang, ASan+UBSan)
            cache_key: Linux-Clang-ASan-UBSan
            cc: clang
            cxx: clang++
            sanitizers: address,undefined
            asan_options: detect_leaks=1:abort_on_error=1:strict_string_checks=1
            ubsan_options: halt_on_error=1:print_stacktrace=1
            tsan_options: ""
          - name: Linux (Clang, TSan)
            cache_key: Linux-Clang-TSan
            cc: clang
            cxx: clang++
            sanitizers: thread
            asan_options: ""
            ubsan_options: ""
            tsan_options: halt_on_error=1:second_deadlock_stack=1

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.cache_key }}
          variant: ccache

      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DPJH_JSON_BUILD_TESTS=ON
          -DPJH_JSON_SANITIZERS=${{ matrix.sanitizers }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          ASAN_OPTIONS: ${{ matrix.asan_options }}
          UBSAN_OPTIONS: ${{ matrix.ubsan_options }}
          TSAN_OPTIONS: ${{ matrix.tsan_options }}
        run: ctest --test-dir build --output-on-failure
